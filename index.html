<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Respite — hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="hero">
      <canvas data-bg aria-hidden="true"></canvas>

      <nav class="rv">
        <a class="logo" href="#">Respite</a>
        <div class="links">
          <a href="#">How it works</a>
          <a href="#">Stories</a>
          <a href="#">For teams</a>
        </div>
      </nav>

      <div class="copy">
        <p class="eyebrow rv" style="--d: 200">Rest is part of the quest</p>
        <h1 class="rv" style="--d: 350">
          Put the sword<br />down <em>for a while.</em>
        </h1>
        <p class="sub rv" style="--d: 550">
          Respite schedules real breaks around your calendar and guards them
          like a knight would. Ten minutes under a tree beats ten more tabs.
        </p>
        <div class="ctas rv" style="--d: 750">
          <a class="btn p" href="#">Take a break — free</a>
          <a class="btn g" href="#">How breaks work</a>
        </div>
        <div class="note rv" style="--d: 950">
          <span class="dots"><i></i><i></i><i></i></span>
          <span><b>41,000</b> people rested today</span>
        </div>
      </div>
    </section>

    <script src="bg.js"></script>
  </body>
</html>
